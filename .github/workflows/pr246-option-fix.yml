name: PR 246 optional tagged-value validation

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.number == 246 && github.head_ref == 'fix/local-tag-enum-precedence-231'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare optional tagged-value fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/binary.rs')
          old = 'assert_eq!(\n        serde_saphyr::from_str::<Option<ByteBuf>>(&yaml).unwrap(),\n        None\n    );'
          new = 'assert_eq!(serde_saphyr::from_str::<Option<ByteBuf>>(&yaml).unwrap(), None);'
          source = p.read_text()
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          PY
          python .github/scripts/pr246-option-fix.py
          sed -i 's/assert_eq!(from_str::<()>(yaml).unwrap(), ());/from_str::<()>(yaml).unwrap();/' tests/option_tag_compatibility.rs
      - name: Install toolchain and format changed sources
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          python - <<'PY'
          import json, subprocess, tarfile
          from pathlib import Path
          files = json.loads(Path('/tmp/pr246-option-files.json').read_text())
          subprocess.run(['rustfmt', '--edition', '2024', *[p for p in files if p.endswith('.rs')]], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          with tarfile.open('/tmp/pr246-option-source.tar.gz', 'w:gz') as archive:
              for path in files:
                  archive.add(path, arcname=path)
          PY
          git diff --cached --check
          git diff --cached --stat
          git diff --cached > /tmp/pr246-option-fix.patch
      - name: Export prepared source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr246-option-fix.py export
      - uses: Swatinem/rust-cache@v2
      - name: Default tests
        id: default
        continue-on-error: true
        run: |
          set +e
          cargo test --lib --tests --no-fail-fast > /tmp/pr246-option-default.log 2>&1
          status=$?
          grep -E 'test result:|FAILED|^error:|^failures:|^----' /tmp/pr246-option-default.log || true
          if [ "$status" -ne 0 ]; then tail -n 180 /tmp/pr246-option-default.log; fi
          exit "$status"
      - name: All-features tests
        id: all
        continue-on-error: true
        run: |
          set +e
          cargo test --all-features --lib --tests --no-fail-fast > /tmp/pr246-option-all.log 2>&1
          status=$?
          grep -E 'test result:|FAILED|^error:|^failures:|^----' /tmp/pr246-option-all.log || true
          if [ "$status" -ne 0 ]; then tail -n 180 /tmp/pr246-option-all.log; fi
          exit "$status"
      - name: Clippy and feature builds
        id: lint
        continue-on-error: true
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --no-default-features --features serialize
          cargo check --no-default-features --features deserialize
      - name: Summarize tests
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('default', 'all'):
              path = Path(f'/tmp/pr246-option-{name}.log')
              if path.exists():
                  rows = re.findall(r'test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored;', path.read_text())
                  print(name, dict(zip(('passed', 'failed', 'ignored'), map(sum, zip(*(map(int, row) for row in rows))))))
          PY
      - name: Upload validation records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr246-option-fix
          path: /tmp/pr246-option-*
          retention-days: 3
      - name: Validation result
        if: always()
        env:
          DEFAULT: ${{ steps.default.outcome }}
          ALL: ${{ steps.all.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          printf 'VALIDATION default=%s all=%s lint=%s\n' "$DEFAULT" "$ALL" "$LINT"
          test "$DEFAULT" = success && test "$ALL" = success && test "$LINT" = success
