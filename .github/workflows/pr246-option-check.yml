name: PR 246 optional tagged-value checks

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.number == 246 && github.head_ref == 'fix/local-tag-enum-precedence-231'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: [default, all]
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library and integration tests
        env:
          FEATURES: ${{ matrix.features }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$FEATURES" = all ]; then args+=(--all-features); fi
          cargo test "${args[@]}" --lib --tests --no-fail-fast 2>&1 | tee /tmp/pr246-option-${FEATURES}.log
      - name: Summarize test results
        if: always()
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('/tmp/pr246-option-' + os.environ['FEATURES'] + '.log')
          if path.exists():
              rows = re.findall(r'test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored;', path.read_text())
              totals = [sum(int(row[i]) for row in rows) for i in range(3)]
              print(os.environ['FEATURES'], dict(zip(('passed', 'failed', 'ignored'), totals)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr246-option-${{ matrix.features }}-tests
          path: /tmp/pr246-option-*.log
          retention-days: 3

  lint:
    if: github.event.pull_request.number == 246 && github.head_ref == 'fix/local-tag-enum-precedence-231'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Formatting and whitespace
        run: |
          rustfmt --edition 2024 --check src/de/api.rs src/de/deserializer.rs tests/binary.rs tests/local_tagged_documents.rs tests/option_tag_compatibility.rs tests/composite_null_keys.rs
          git diff --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --no-default-features --features serialize
      - run: cargo check --no-default-features --features deserialize
