name: Fuzz & Audit

on:
  schedule:
    - cron: '50 5 1,11,21 * *'  # Runs three times a month on the 1st, 11th, and 21st at 00:50 EST (05:50 UTC)
  workflow_dispatch:     # Allows manual triggering

permissions: read-all

jobs:
  fuzz_test_audit:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly
        run: |
          export PATH=$PATH:/home/github-runner_2/.cargo/bin:/home/github-runner/.cargo/bin                  
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install cargo-fuzz and cargo-audit
        run: |
          export PATH=$PATH:/home/github-runner_2/.cargo/bin:/home/github-runner/.cargo/bin          
          cargo install cargo-fuzz
          cargo install cargo-audit

      - name: Run standard tests, taking advantage we now have nightly Rust, normally we test with stable
        run: |
          export PATH=$PATH:/home/github-runner_2/.cargo/bin          
          cargo test --verbose

      - name: Run cargo audit, this also makes sense to run periodically
        run: |
          export PATH=$PATH:/home/github-runner_2/.cargo/bin:/home/github-runner/.cargo/bin          
          cargo audit
        
      - name: Run every fuzz target with regression seeds
        shell: bash
        run: |
          export PATH=$PATH:/home/github-runner_2/.cargo/bin:/home/github-runner/.cargo/bin
          cargo +nightly fuzz build
          targets=$(cargo +nightly fuzz list)
          failed=0
          for target in $targets; do
            mkdir -p "fuzz/corpus/$target"
            # libFuzzer writes new inputs only into the first corpus directory.
            corpora=("fuzz/corpus/$target")
            if [ -d "fuzz/seeds/$target" ]; then
              corpora+=("fuzz/seeds/$target")
            fi
            cargo +nightly fuzz run "$target" "${corpora[@]}" -- \
              -max_total_time=300 -rss_limit_mb=1024 -max_len=65536 \
              -timeout=15 -dict=fuzz/yaml.dict || failed=1
          done
          exit "$failed"

      - name: Upload fuzz crash artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts/
