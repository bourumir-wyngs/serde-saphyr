name: PR 246 unit tag round-trip validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.number == 246 && github.head_ref == 'fix/local-tag-enum-precedence-231'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare source changes
        run: python .github/scripts/pr246-unit-output.py
      - name: Install toolchain and format changed sources
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, tarfile
          paths = json.loads(Path('/tmp/pr246-unit-files.json').read_text())
          subprocess.run(['rustfmt', '--edition', '2024', *[p for p in paths if p.endswith('.rs')]], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          with tarfile.open('/tmp/pr246-unit-source.tar.gz', 'w:gz') as archive:
              for path in paths:
                  archive.add(path, arcname=path)
          PY
          git diff --cached --check
          git diff --cached --stat
          git diff --cached > /tmp/pr246-unit-output.patch
      - name: Export prepared source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr246-unit-output.py export
      - uses: Swatinem/rust-cache@v2
      - name: Default tests
        id: default
        continue-on-error: true
        run: |
          set +e
          cargo test --lib --tests --no-fail-fast > /tmp/pr246-unit-default.log 2>&1
          status=$?
          grep -E 'test result:|FAILED|^error|^failures:|^----' /tmp/pr246-unit-default.log || true
          if [ "$status" -ne 0 ]; then tail -n 160 /tmp/pr246-unit-default.log; fi
          exit "$status"
      - name: All-features tests
        id: all
        continue-on-error: true
        run: |
          set +e
          cargo test --all-features --lib --tests --no-fail-fast > /tmp/pr246-unit-all.log 2>&1
          status=$?
          grep -E 'test result:|FAILED|^error|^failures:|^----' /tmp/pr246-unit-all.log || true
          if [ "$status" -ne 0 ]; then tail -n 160 /tmp/pr246-unit-all.log; fi
          exit "$status"
      - name: Lint and feature builds
        id: lint
        continue-on-error: true
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo check --no-default-features --features serialize
          cargo check --no-default-features --features deserialize
      - name: Summarize tests
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('default', 'all'):
              path = Path('/tmp/pr246-unit-' + name + '.log')
              if path.exists():
                  rows = re.findall(r'test result: \w+\. (\d+) passed; (\d+) failed; (\d+) ignored;', path.read_text())
                  print(name, dict(zip(('passed', 'failed', 'ignored'), [sum(int(r[i]) for r in rows) for i in range(3)])))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr246-unit-output
          path: /tmp/pr246-unit-*
          retention-days: 3
      - name: Validation result
        if: always()
        env:
          DEFAULT: ${{ steps.default.outcome }}
          ALL: ${{ steps.all.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          printf 'VALIDATION default=%s all=%s lint=%s\n' "$DEFAULT" "$ALL" "$LINT"
          test "$DEFAULT" = success && test "$ALL" = success && test "$LINT" = success
